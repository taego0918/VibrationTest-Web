<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | VibrationTest</title>
    <style>
      html, body {
        background-color: #000;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* === 自訂 Loading 畫面樣式 === */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0f172a; /* 深藍色質感背景 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease; /* 淡出效果 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      #loading-title {
        color: #f8fafc;
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 20px;
        letter-spacing: 1px;
      }

      #progress-bar-bg {
        width: 260px;
        height: 8px;
        background-color: #334155;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
      }

      #progress-bar-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #818cf8); /* 漸層科技感 */
        border-radius: 4px;
        transition: width 0.15s ease-out;
      }

      #loading-text {
        color: #94a3b8;
        font-size: 14px;
        margin-top: 12px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    
    <!-- Loading 畫面 HTML 結構 -->
    <div id="loading-screen">
      <div id="loading-title">LOADING...</div>
      <div id="progress-bar-bg">
        <div id="progress-bar-fill"></div>
      </div>
      <div id="loading-text">0%</div>
    </div>

    <canvas id="unity-canvas" width=720 height=1280 tabindex="-1" style="width: 720px; height: 1280px; background: #231F20"></canvas>
    <script src="Build/Web.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      }
      
      function checkOrientation() {
        let w = window.innerWidth;
        let h = window.innerHeight;
        let ratio = w / h;
        let targetRatio = 1;
        
        var canvas = document.querySelector("#unity-canvas");
        
        if(ratio < 9/21){
          targetRatio = 9/21;
        }else if(ratio > 9/16){
          targetRatio = 9/16;
        }else{
          targetRatio = ratio; 
        }
        
        //console.log("目前比例: " + ratio.toFixed(2) +","+targetRatio.toFixed(2));
        
        let isPhone = (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)); 
        if (ratio > targetRatio) {
          canvas.style.width = (h * targetRatio) + "px";
          canvas.style.height = (isPhone)? h + "px" : "100vh";
        } else {
          canvas.style.width = (isPhone)? w + "px": "100vw";
          canvas.style.height = (w / targetRatio) + "px";
        }
      }

      // 監聽視窗大小改變
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', () => {
          setTimeout(checkOrientation, 200);
      });
      checkOrientation();

      // Loading 畫面控制變數
      const loadingScreen = document.getElementById('loading-screen');
      const progressBarFill = document.getElementById('progress-bar-fill');
      const loadingText = document.getElementById('loading-text');

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/Web.data.unityweb",
        frameworkUrl: "Build/Web.framework.js.unityweb",
          codeUrl: "Build/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "VibrationTest",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }, (progress) => {
        // 即時更新下載進度 (0.0 ~ 1.0)
        const percent = Math.round(progress * 100);
        progressBarFill.style.width = percent + "%";
        loadingText.innerText = percent + "%";
      }).then((unityInstance) => {
        // 載入完成，淡出隱藏 Loading 畫面
        loadingScreen.style.opacity = "0";
        setTimeout(() => {
          loadingScreen.style.display = "none";
        }, 500); // 配合 CSS transition 0.5s 淡出

      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
